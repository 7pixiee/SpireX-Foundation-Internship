<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A simple, responsive real-time digital clock."
    />
    <title>Digital Clock</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="clock-card">
      <div class="top-row">
        <button
          class="theme-button"
          id="themeButton"
          type="button"
          aria-label="Switch colour theme"
        >
          ☾
        </button>
      </div>

      <section class="clock-content" aria-label="Current time">
        <p class="greeting" id="greeting">A little moment in time</p>
        <div class="time-wrap">
          <time class="time" id="clock" aria-live="off">00:00:00</time>
          <span class="period" id="period">AM</span>
        </div>
        <p class="date" id="date">Loading date...</p>
        <div class="divider"></div>
        <p class="timezone">YOUR LOCAL TIME</p>
      </section>

      <div class="bottom-row">
        <button class="format-button" id="formatButton" type="button">
          24-HOUR FORMAT
        </button>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
