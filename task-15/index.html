<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Workwell | Job Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Serif+Display&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-head">
      <div class="wrap head-row">
        <a class="logo" href="#top">Workwell</a>
        <button class="saved-toggle" id="savedToggle" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path
              d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 2.9 4.5 6.6 4.5c2 0 3.5 1 5.4 3 1.9-2 3.4-3 5.4-3 3.7 0 5.7 3.9 4.2 7.3C19.5 16.4 12 21 12 21z"
            />
          </svg>
          Saved jobs <span id="savedCount">0</span>
        </button>
      </div>
    </header>

    <main id="top">
      <section class="hero">
        <div class="wrap hero-grid">
          <div class="hero-copy">
            <h1>Find work you would <em>actually</em> look forward to</h1>
            <p>
              Browse openings from growing companies, filter by what matters to
              you, and read the full role before you apply.
            </p>

            <form class="search" id="searchForm" role="search">
              <label class="search-field">
                <span>Job title or company</span>
                <input
                  type="search"
                  id="keyword"
                  placeholder="Designer, developer, Acme..."
                  autocomplete="off"
                />
              </label>
              <label class="search-field">
                <span>Location</span>
                <input
                  type="search"
                  id="place"
                  placeholder="City or remote"
                  autocomplete="off"
                />
              </label>
              <button type="submit" class="search-btn">Search jobs</button>
            </form>

            <p class="quick">
              Popular searches:
              <button type="button" class="quick-tag" data-term="Developer">
                Developer
              </button>
              <button type="button" class="quick-tag" data-term="Designer">
                Designer
              </button>
              <button type="button" class="quick-tag" data-term="Analyst">
                Analyst
              </button>
              <button type="button" class="quick-tag" data-term="Marketing">
                Marketing
              </button>
            </p>
          </div>

          <aside class="hero-stats" aria-label="Portal summary">
            <div><strong id="statRoles">0</strong><span>open roles</span></div>
            <div>
              <strong id="statCompanies">0</strong><span>companies hiring</span>
            </div>
            <div>
              <strong id="statRemote">0</strong><span>remote positions</span>
            </div>
          </aside>
        </div>
      </section>

      <section class="wrap listing">
        <div class="filters">
          <div class="pills" id="typePills" role="group" aria-label="Job type">
            <button class="pill" aria-pressed="true" data-type="All">
              All types
            </button>
            <button class="pill" aria-pressed="false" data-type="Full-time">
              Full-time
            </button>
            <button class="pill" aria-pressed="false" data-type="Part-time">
              Part-time
            </button>
            <button class="pill" aria-pressed="false" data-type="Internship">
              Internship
            </button>
            <button class="pill" aria-pressed="false" data-type="Contract">
              Contract
            </button>
          </div>

          <div class="controls">
            <label
              >Work mode
              <select id="modeFilter">
                <option value="all">Any</option>
                <option>On-site</option>
                <option>Hybrid</option>
                <option>Remote</option>
              </select>
            </label>
            <label
              >Experience
              <select id="levelFilter">
                <option value="all">Any</option>
                <option>Fresher</option>
                <option>1-3 years</option>
                <option>3+ years</option>
              </select>
            </label>
            <label class="range"
              >Minimum salary: <b id="salaryLabel">Any</b>
              <input
                type="range"
                id="salaryRange"
                min="0"
                max="25"
                step="1"
                value="0"
              />
            </label>
            <label
              >Sort by
              <select id="sortBy">
                <option value="newest">Newest first</option>
                <option value="salary">Highest salary</option>
              </select>
            </label>
          </div>
        </div>

        <p class="result-count" id="resultCount" aria-live="polite"></p>
        <ul class="jobs" id="jobList"></ul>
      </section>
    </main>

    <footer class="site-foot">
      <div class="wrap">
        Workwell &middot; Job Portal UI project &middot; <span id="year"></span>
      </div>
    </footer>

    <div class="overlay" id="overlay"></div>
    <aside
      class="drawer"
      id="drawer"
      aria-hidden="true"
      aria-label="Job details"
    ></aside>
    <div class="toast" id="toast" role="status"></div>

    <script src="script.js"></script>
  </body>
</html>
